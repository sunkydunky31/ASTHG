name: "ASTHE Build"
on:
  workflow_dispatch:
    inputs:
      # Most of these parameters are available on the Setup Script
      # You can only change them if:
      # - You called the script on terminal and not double-clicked it
      # - You change the behavior of the script (lol)

      build-type:
        description: "Select the build type of the game."
        type: choice
        required: true
        default: 'debug'
        options:
          - debug
          - release
          - final
      arch-32: # NOTE: I didn't test it, tell me if it works!
        description: "Should your build be for 32bits?"
        type: boolean
        default: false
  push:
    branches: ["main"]
jobs:
  build:
    name: "Build the game (${{matrix.target}})"
    permissions: write-all
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: "windows"
            runs-on: windows-latest
          - target: "linux"
            runs-on: ubuntu-latest
          - target: "macos" # NEEDS TESTING!
            runs-on: macos-latest
    runs-on: ${{matrix.runs-on}}
    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v5
      - name: "Setup Haxe 4.3.7"
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"
      - name: "Define HAXEPATH env var" # why
        shell: pwsh
        run: |
          $p = [System.IO.Path]::GetDirectoryName("$env:HAXE_STD_PATH")
          echo "HAXEPATH=$p" >> $env:GITHUB_ENV
      - name: "Cache Haxe & Libraries"
        uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'Windows' && '%USERPROFILE%\\.haxelib' || '~/.haxelib' }}
          key: cache-haxe-${{matrix.target}}-${{hashFiles('**/hmm.json')}}
          restore-keys: |
            cache-haxe-${{matrix.target}}
      - name: "Cache Local Libraries"
        uses: actions/cache@v5
        with:
          path: ".haxelib"
          key: cache-gamelibs-${{ matrix.target }}-${{ hashFiles('**/hmm.json') }}
          restore-keys: cache-gamelibs-${{ matrix.target }}-
      - name: "Install Dependencies"
        run: |
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          haxelib --global run hmm install
      - name: "Build the Game (Debug)"
        if: ${{ github.event.inputs.build-type == 'release' }}
        run: haxelib run lime build cpp -debug
      - name: "Build the Game (Debug)"
        if: ${{ github.event.inputs.build-type == 'debug' || github.event.inputs.build-type == '' }}
        run: haxelib run lime build cpp -debug
      - name: "Build the Game (Final)"
        if: ${{ github.event.inputs.build-type == 'final'}}
        run: haxelib run lime build cpp -final
      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ format('ASTHE ({0}) - {1}', (github.event.inputs.build-type), runner.os) }}
          path: ${{ format('export/{0}/{1}/bin', github.event.inputs.build-type, matrix.target) }}
