name: "USE (Unnamed Sonic Engine) Build"

on:
  workflow_dispatch:
    inputs:
      # Most of these parameters are available on the Setup Script
      # You can only change them if:
      # - You called the script on terminal and not double-clicked it
      # - You change the behavior of the script (lol)

      build-type:
        description: "Select the build type of the game."
        type: choice
        required: true
        default: "release"
        options:
          - debug
          - release
          - final

      # NOTE: I didn't test it, tell me if it works!
      arch-32:
        description: "Should your build be for 32bits?"
        type: boolean
        default: false

      runner-os:
        description: "Select which OS runner to use for the build."
        type: choice
        required: true
        default: "windows-latest"
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

jobs:
  setup:
    name: "Setup the build environment"
    permissions: write-all
    runs-on: ${{ github.event.inputs.runner-os }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Haxe 4.3.7"
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"

      - name: "Install Dependencies"
        shell: "pwsh"
        run: |
          & "haxelib" "--global" "install" "hmm" "--quiet"
          Start-Sleep 2

          & "haxelib" "--global" "run" "hmm" "setup"
          Start-Sleep 2

          & "haxelib" "--global" "run" "hmm" "install"
      - name: "Cache Haxe & Libraries"
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && '%USERPROFILE%\\.haxelib' || '~/.haxelib' }}
          key: cache-libraries


  build:
    needs: setup
    runs-on: ${{ github.event.inputs.runner-os }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Restore Haxe Cache"
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && '%USERPROFILE%\\.haxelib' || '~/.haxelib' }}
          key: cache-libraries

      - name: "Build the Game"
        if: ${{ github.event.inputs.arch-32 == false }}
        run: pwsh -File "./_project/build/build.ps1" -Platform cpp -BuildType ${{ github.event.inputs.build-type }} -Action build

      - name: "Build the Game (32-Bit)"
        if: ${{ github.event.inputs.arch-32 == true }}
        run: pwsh -File "./_project/build/build.ps1" -Platform cpp -BuildType ${{ github.event.inputs.build-type }} -Action build -Is32Bits

        # We can't use: run, -watch, test; because it's a online VM, not a local one

      - run: echo "Uploading files..."

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-cpp-${{ github.event.inputs.build-type }}
          path: export/${{ github.event.inputs.build-type }}/${{ runner.os }}/bin
