name: "USE (Unnamed Sonic Engine) Build"

on:
  workflow_dispatch:
    inputs:
      # Most of these parameters are available on the Setup Script
      # You can only change them if:
      # - You called the script on terminal and not double-clicked it
      # - You change the behavior of the script (lol)

      build-type:
        description: "Select the build type of the game."
        type: choice
        required: true
        default: "release"
        options:
          - debug
          - release
          - final
      arch-32: # NOTE: I didn't test it, tell me if it works!
        description: "Should your build be for 32bits?"
        type: boolean
        default: false
  push:
    branches: ["test-workflow"]
jobs:
  build:
    name: "Build the game (${{matrix.target}} env.)"
    permissions: write-all
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: "windows"
            runs-on: windows-latest
          - target: "linux"
            runs-on: ubuntu-latest
          - target: "macos"
            runs-on: macos-latest
    runs-on: ${{matrix.runs-on}}
    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v4
      - name: "Setup Haxe 4.3.7"
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"
      - name: "Define HAXEPATH env var" # why
        shell: pwsh
        run: |
          $p = [System.IO.Path]::GetDirectoryName("$env:HAXE_STD_PATH")
          echo "HAXEPATH=$p" >> $env:GITHUB_ENV
      - name: "Cache Haxe & Libraries"
        uses: actions/cache@v3
        with:
          path: ${{ runner.os == 'Windows' && '%USERPROFILE%\\.haxelib' || '~/.haxelib' }}
          key: cache-haxe-${{matrix.target}}-${{hashFiles('**/hmm.json')}}
          restore-keys: |
            cache-haxe-${{matrix.target}}
      - name: "Cache Local Libraries"
        uses: actions/cache@v3
        with:
          path: ".haxelib"
          key: cache-gamelibs-${{ matrix.target }}-${{ hashFiles('**/hmm.json') }}
          restore-keys: cache-gamelibs-${{ matrix.target }}-
      - name: "Install Dependencies"
        shell: "pwsh"
        run: |
          & "haxelib" "--global" "install" "hmm" "--quiet"; Start-Sleep 2
          & "haxelib" "--global" "run" "hmm" "setup"; Start-Sleep 2
          & "haxelib" "--global" "run" "hmm" "install"
      - name: "Compile HXCPP" # Required since we're using FunkinCrew version...
        shell: bash
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../../../..
      - name: "Build the Game (${{github.event.inputs.build-type || 'release'}})"
        run: haxelib run lime build cpp ${{ github.event.inputs.build-type == 'debug' && '-debug' || (github.event.inputs.build-type == 'final' && '-final' || '') }} # We can't use: run, -watch, test; because it's a online VM, not a local one
      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-${{matrix.target}}-${{ github.event.inputs.build-type || 'release' }}
          path: ${{ format('export/{0}/{1}/bin', github.event.inputs.build-type || 'release', matrix.target) }}
